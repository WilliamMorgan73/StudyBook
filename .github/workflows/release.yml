# Builds the installable desktop app for Linux and Windows.
#
# - Push a tag `vX.Y.Z` (matching `version` in frontend/src-tauri/tauri.conf.json) to get a *draft* GitHub
#   release with the installers attached; review it and publish it by hand.
# - Run it manually (Actions → Release → Run workflow) to build without a release; the installers are
#   attached to the run as artifacts.
#
# Builds are unsigned: Windows SmartScreen warns on first run ("More info" → "Run anyway").
name: Release

on:
  push:
    tags: ["v*"]
    branches: [ci/workflows] # TEMPORARY: test the build from the PR branch; remove before merging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc for the .deb/.AppImage
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match tauri.conf.json version ${version}"
            exit 1
          fi

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      # The backend is bundled by `beforeBuildCommand` (backend/packaging/build.py, PyInstaller), which
      # needs uv and the backend's `build` dependency group.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --group build
        working-directory: backend

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: StudyBook ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below.

            - **Linux:** `.deb` (Debian/Ubuntu) or `.AppImage` (any distro: make it executable and run it).
            - **Windows:** the `-setup.exe`. Windows may warn that the app is unrecognised, since it isn't
              signed yet: choose **More info → Run anyway**.

            Your data stays on your computer. Moving from another install? Use **Restore from a backup** on
            the first-run screen.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}
