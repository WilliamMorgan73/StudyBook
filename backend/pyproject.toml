[project]
name = "studybook-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "=Will Morgan", email = "=" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "fastapi>=0.141.1",
    "google-genai>=2.26.0",
    "markitdown[pdf,pptx]>=0.1.8",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI's Depends(...) default-arg pattern is idiomatic, not a real bug
]
