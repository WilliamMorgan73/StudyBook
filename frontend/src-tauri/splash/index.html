<!doctype html>
<!-- Shown by the packaged desktop app while its bundled server starts (src-tauri/src/lib.rs), then replaced
     by the app itself. The window is frameless, so this page is the drag region and has its own close button. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StudyBook</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f7; --fg: #171717; --muted: #737373; --border: #e5e5e5; --danger: #dc2626; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --border: #262626; --danger: #f87171; }
      }
      html, body { height: 100%; margin: 0; box-sizing: border-box; }
      /* Linux: the window is transparent and the page rounds its corners, like the app (index.css). */
      html.rounded { background: transparent; overflow: hidden; }
      html.rounded body { border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; user-select: none; cursor: default;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); max-width: 32rem; text-align: center; }
      .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--fg); border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
      #error { display: none; color: var(--danger); user-select: text; }
      body.failed .spinner { display: none; }
      body.failed #error { display: block; }
      #close {
        position: fixed; top: 8px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 6px;
        background: transparent; color: var(--muted); font-size: 18px; cursor: pointer;
      }
      #close:hover { background: var(--danger); color: white; }
    </style>
  </head>
  <body data-tauri-drag-region="deep">
    <button id="close" type="button" aria-label="Close window">✕</button>
    <h1>StudyBook</h1>
    <div class="spinner" role="progressbar" aria-label="Starting"></div>
    <p id="status">Starting…</p>
    <p id="error" role="alert"></p>
    <script>
      if (navigator.userAgent.includes('Linux')) document.documentElement.classList.add('rounded')
      document.getElementById('close').addEventListener('click', () => {
        window.__TAURI_INTERNALS__?.invoke('plugin:window|close', { label: 'main' })
      })
      // Called by the shell if the server doesn't come up.
      window.showStartupError = (message) => {
        document.body.classList.add('failed')
        document.getElementById('status').textContent = 'StudyBook couldn’t start.'
        document.getElementById('error').textContent = message
      }
    </script>
  </body>
</html>
